        <!-- 🔽 Librairie Markdown -->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        <!-- 🔽 Script de chargement Markdown -->
        <script>
            fetch("https://raw.githubusercontent.com/Virtualescola66/Virtualescola66.github.io/refs/heads/site/articles/article.md.md")
                .then(response => response.text())
                .then(markdown => {
                    document.getElementById("article-md").innerHTML =
                        marked.parse(markdown);
                })
                .catch(error => {
                    document.getElementById("article-md").innerHTML =
                        "<p>Impossible de charger l’article.</p>";
                });
        </script>
