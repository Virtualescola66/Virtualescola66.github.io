<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour analyser, réfléchir, proposer</title>
  <link rel="icon" href="image/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <section id="accueil">
      <h2>Pour analyser, réfléchir et proposer</h2>
      <img
        src="image/Stylo.jpg"
        class="hero-image"
        alt="Des stylos en forme de goutte inversée"
      >
      <p>Un site dédié à des réflexions sur l'école.</p>
      <button id="theme-toggle" type="button" aria-label="Activer le mode sombre">🌙 Mode sombre</button>
    </section>

    <section id="avancer">
      <h2>Avancer</h2>
      <p>📅 Date : <span id="current-date">Chargement…</span><br>📍 Lieu : Mon cerveau</p>
      <ul id="next-steps"></ul>
    </section>

    <section id="analyser">
      <h2>Analyser</h2>
      <label for="article-select">Choisir un article :</label>
      <select id="article-select"></select>
      <div id="article-md" aria-live="polite">
        <p>Chargement de l'article…</p>
      </div>
    </section>

    <section id="proposer">
      <h2>Proposer</h2>
      <img src="image/logo.png" alt="Logo noir et blanc">
      <img src="image/logo_colour.png" alt="Logo couleur">
    </section>
  </main>

  <footer>
    <p>© MC Production</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
